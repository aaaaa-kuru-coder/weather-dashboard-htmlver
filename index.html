<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>天気ダッシュボード</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header class="page-header">
      <div>
        <h1>🌤 天気ダッシュボード</h1>
        <p id="updatedAt" class="updated-at">最終更新：取得中...</p>
      </div>
      <div class="controls">
        <button id="refreshButton" class="button primary" type="button">最新データを取得</button>
        <button id="csvButton" class="button secondary" type="button" disabled>CSVを保存</button>
      </div>
    </header>

    <div id="status" class="status" role="status" aria-live="polite">Open-Meteoからデータを取得しています...</div>

    <section class="card chart-card">
      <div class="chart-header">
        <h2>今日の天気予報</h2>
        <span id="chartUpdatedAt" class="chart-updated-at"></span>
      </div>
      <div class="chart-wrap">
        <canvas id="weatherChart" aria-label="天気予報グラフ"></canvas>
      </div>
      <div id="tomorrowNote" class="tomorrow-note" hidden>
        ※薄い点線は翌日0～18時を同じ時刻位置に重ねて表示
      </div>
    </section>

    <section class="card legend-card" aria-label="降水量予報の凡例">
      <h3>■ 降水量予報（mm/h）</h3>
      <div id="rainLegend" class="rain-legend"></div>
    </section>

    <details class="card details-card">
      <summary>表示仕様</summary>
      <ul>
        <li>一昨日・昨日の気温、今日の気温、今日の降水確率を表示します。</li>
        <li>今日の気温は現在時刻まで実線、以後を点線で表示します。</li>
        <li>降水確率10%以上の時刻には、降水量に応じた色の四角マーカーを表示します。</li>
        <li>WMO天気コード95・96・99では雷マークを表示します。</li>
        <li>18時以降は翌日0～18時を同じ0～18時の位置へ重ねて表示します。</li>
      </ul>
    </details>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
